openapi: 3.2.0
info:
  title: UKG Ready Content API
  version: 1.0.0
  summary: REST API for the UKG Ready HCM platform.
  description: 'UKG Ready is UKG''s unified Human Capital Management suite for small and

    midmarket organizations.'
  contact:
    name: UKG Developer Portal
    url: https://developer.ukg.com
  license:
    name: Proprietary
    url: https://www.ukg.com/legal
servers:
- url: https://{hostname}/api
  description: Tenant-specific UKG Ready API host
  variables:
    hostname:
      default: secure.saashr.com
      description: Customer-specific UKG Ready hostname assigned at provisioning
security:
- bearerAuth: []
tags:
- name: Content
  description: Tenant content and posts
paths:
  /content/v1/posts:
    post:
      tags:
      - Content
      summary: Create a post
      description: Create a new content post in the tenant.
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    PostInput:
      type: object
      required:
      - title
      - body
      properties:
        title:
          type: string
        body:
          type: string
        audienceGroupId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 bearer access token issued via /authentication/access_token.
