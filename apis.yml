apis:
- aid: ukg-ready:rest-api
  name: UKG Ready REST API
  description: >-
    RESTful API for UKG Ready providing programmatic access to employees, HR records, payroll, time and
    attendance, schedules, accruals, benefits, and workforce reporting. The base URL is per-tenant (https://{hostname}/api).
    Authentication uses OAuth 2.0 authorization code flow with bearer access tokens issued via the UKG
    Ready auth service.
  humanURL: https://developer.ukg.com
  baseURL: https://{hostname}/api
